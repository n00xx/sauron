<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  :root {
    --primary: #fe4155;
    --primary-dark: #982633;
    --bg: #0d121b;
    --text: #f2f5f8;
    --muted: #93a1b3;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; }
  body {
    font-family: Inter, -apple-system, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 90% at 30% -10%, #1d2736 0%, var(--bg) 62%);
    display: grid;
    grid-template-columns: 1fr 380px;
    align-items: center;
    gap: 64px;
    padding: 0 88px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    width: 900px; height: 900px;
    left: -260px; top: -320px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(254, 65, 85, 0.26) 0%, rgba(254, 65, 85, 0) 70%);
  }
  .copy { position: relative; }
  .pill {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.08em;
  }
  h1 {
    margin-top: 30px;
    font-weight: 800;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.03em;
  }
  p {
    margin-top: 30px;
    font-weight: 500;
    font-size: 36px;
    color: var(--muted);
  }
  .url {
    margin-top: 14px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 46px;
    color: var(--primary);
  }
  .qr {
    position: relative;
    background: #ffffff;
    border-radius: 26px;
    padding: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .qr img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="copy">
    <span class="pill">NEEXY</span>
    <h1>Membresía<br>vencida</h1>
    <p>Renuévala y vuelve a ver todo:</p>
    <div class="url">neexy.net/pay</div>
  </div>
  <div class="qr"><img src="qr.svg" alt=""></div>
</body>
</html>
