<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  :root {
    --primary: #fe4155;
    --primary-dark: #982633;
    --bg: #0d121b;
    --text: #f2f5f8;
    --muted: #93a1b3;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; }
  body {
    font-family: Inter, -apple-system, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 90% at 30% -10%, #1d2736 0%, var(--bg) 62%);
    display: grid;
    grid-template-columns: 1fr 360px;
    align-items: center;
    gap: 56px;
    padding: 0 80px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    width: 900px; height: 900px;
    left: -260px; top: -320px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(254, 65, 85, 0.26) 0%, rgba(254, 65, 85, 0) 70%);
  }
  .copy { position: relative; }
  .pill {
    display: inline-block;
    padding: 10px 24px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.08em;
  }
  h1 {
    margin-top: 26px;
    font-weight: 800;
    font-size: 96px;
    line-height: 0.98;
    letter-spacing: -0.03em;
  }
  .lead {
    margin-top: 26px;
    font-weight: 700;
    font-size: 34px;
  }
  .label {
    margin-top: 30px;
    font-weight: 500;
    font-size: 26px;
    color: var(--muted);
  }
  .url {
    margin-top: 10px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 30px;
    color: var(--primary);
    white-space: nowrap;
  }
  .qr {
    position: relative;
    background: #ffffff;
    border-radius: 26px;
    padding: 20px 20px 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .qr img { display: block; width: 100%; height: auto; }
  .qr p {
    margin-top: 10px;
    color: var(--bg);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
  }
</style>
</head>
<body>
  <div class="copy">
    <span class="pill">NEEXY</span>
    <h1>Membresía<br>vencida</h1>
    <p class="lead">¡Renuévala y vuelve a ver todo! 🍿</p>
    <p class="label">Escanea el código o entra desde tu celular a:</p>
    <div class="url">https://neexy.net/pay?renovar=1</div>
  </div>
  <div class="qr">
    <img src="qr.svg" alt="">
    <p>📱 Apunta la cámara de tu<br>celular y toca el enlace</p>
  </div>
</body>
</html>
