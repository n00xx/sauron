[extractors]
# The wizard steps are Jinja too: markdown with {{ _('…') }} calls, rendered
# through render_template_string. They need a custom extractor because their
# {{ widget:… }} placeholders are not valid Jinja — see the module docstring.
wizard_step = app.services.wizard_step_babel:extract_wizard_step

[python: app/**.py]
[jinja2: app/templates/**.html]
[wizard_step: wizard_steps/**.md]
;extensions=jinja2.ext.autoescape,jinja2.ext.with_39
